services:
  mysql:
    image: mysql:8.4
    container_name: kunwu-admin-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION,ERROR_FOR_DIVISION_BY_ZERO
      - --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kunwu_admin}
      MYSQL_USER: ${MYSQL_USER:-kunwu_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kunwu_admin_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kunwu_root_dev}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - kunwu-admin-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  kunwu-admin-mysql-data:
